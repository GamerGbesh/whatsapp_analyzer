services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp-backend
    restart: unless-stopped
    environment:
      RUST_LOG: info
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:3000"
    container_name: whatsapp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:3000"
