services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp-backend
    restart: unless-stopped
    environment:
      RUST_LOG: info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: whatsapp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
